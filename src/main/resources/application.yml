# 公共配置：所有需要按环境覆盖的项都提供本地默认值（环境变量可覆盖）
# 个人差异（数据库密码、COS 桶等）请复制 application-local.example.yml 为 application-local.yml 修改
spring:
  application:
    name: CommonReviewSystem
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/crs?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowMultiQueries=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari.max-lifetime: 30000
    hikari.connection-timeout: 60000
    hikari.connection-test-query: SELECT 1
    hikari.idle-timeout: 18000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:1080}
  address: ${SERVER_ADDRESS:127.0.0.1}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml
  type-handlers-package: com.sast.crs.handler

app:
  defaultCover: ${APP_DEFAULT_COVER:}

jwt:
  secret: ${JWT_SECRET:}  #JWT密钥
  expiration: 864000000             #JWT过期时间（1000天）

file:
  COS:
    region: ${COS_REGION:ap-shanghai}
    uploadExpiredTime: 15
    downloadExpiredTime: 15
