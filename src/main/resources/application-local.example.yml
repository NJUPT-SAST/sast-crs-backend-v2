# 个人配置模板（唯一需要复制修改的文件）
# 使用方式：
# 1) 复制为 application-local.yml 或 application-<yourname>.yml（该文件加入 .gitignore，不会提交）
# 2) 启动时指定 profile：
#    - mvn: .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=local
#    - jar:  java -jar xxx.jar --spring.profiles.active=local
# 3) 未写在这里的配置使用 application.yml 中的公共默认值（也可用环境变量覆盖）

spring:
  datasource:
    # 你的本地数据库账号
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/crs?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowMultiQueries=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:你的密码}

server:
  # 本地端口习惯（默认 8080，可改 1080 与前端代理一致）
  port: ${SERVER_PORT:1080}

# 腾讯云 COS（用到文件功能时才需要填写；region、过期时间等公共默认值见 application.yml）
file:
  COS:
    bucketName: <dev-bucket-name>
    publicFolder: dev-<yourname>-public
    privateFolder: dev-<yourname>-private
    secretId: ${COS_SECRET_ID:}
    secretKey: ${COS_SECRET_KEY:}

# 注意：一旦调用上传/下载/删除相关接口，会因缺少 COS 配置而失败。
