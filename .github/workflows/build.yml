name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 拉取完整历史，spotless ratchet 需要 main 分支引用
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PR 的 checkout 是 detached HEAD，只有 origin/main 远程引用；
      # 为 spotless ratchetFrom main 创建本地 main 引用
      - name: Create local main ref
        run: git branch main origin/main 2>/dev/null || git branch main HEAD

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven (spotless + package)
        run: mvn -B package
